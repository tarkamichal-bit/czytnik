name: Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk czytnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: czytnik-apk
          path: mobile/czytnik.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest czytnik.apk \
            --target "${{ github.sha }}" \
            --title "Czytnik – najnowsza wersja" \
            --notes "Plik czytnik.apk do instalacji na Androidzie. Zbudowano z commita ${{ github.sha }}."
